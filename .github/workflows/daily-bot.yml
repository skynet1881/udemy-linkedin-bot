name: Daily Udemy LinkedIn Bot

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in root:"
          ls -la
          echo "Files in subfolder:"
          ls -la udemy-linkedin-bot || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run bot
        env:
          BOT_TIMEZONE: Europe/Berlin
          CONFIG_PATH: config/courses.json
          STATE_PATH: state/runtime_state.json
          HEADLESS: "true"
          DRY_RUN: "true"
          UDEMY_STORAGE_STATE_B64: ${{ secrets.UDEMY_STORAGE_STATE_B64 }}
          LINKEDIN_STORAGE_STATE_B64: ${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}
        run: python run_bot.py

      - name: Commit updated runtime state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/runtime_state.json
          git diff --cached --quiet || git commit -m "Update runtime state"
          git push
